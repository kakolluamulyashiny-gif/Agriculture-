<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agritrio — Farmer Dashboard</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ---------- CSS (single-file) ---------- */
    :root{
      --bg:#071027; --card:#081526; --muted:#9fb0c6; --accent:#16a34a;
      font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    html,body,#root{height:100%}
    body{
      margin:0; background:linear-gradient(180deg,#051225 0%, #071027 100%); color:#ecf8ff;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    .app{display:flex;gap:20px;padding:20px;min-height:100vh}
    .sidebar{
      width:270px;background:linear-gradient(180deg,var(--card),#041222);
      border-radius:12px;padding:18px;box-shadow:0 8px 30px rgba(2,6,23,0.6);
    }
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:8px}
    .logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#06b6d4);display:flex;align-items:center;justify-content:center;font-weight:800;color:#012}
    .nav{margin-top:14px;display:flex;flex-direction:column;gap:6px}
    .nav button{background:transparent;border:0;color:var(--muted);padding:10px;border-radius:8px;text-align:left;cursor:pointer}
    .nav button:hover{background:rgba(255,255,255,0.02);color:#fff}
    .nav button.active{background:linear-gradient(90deg, rgba(16,185,129,0.10), rgba(6,182,212,0.03));color:#fff}
    .main{flex:1;display:flex;flex-direction:column;gap:18px}
    .topbar{display:flex;justify-content:space-between;align-items:center}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); padding:14px;border-radius:12px}
    .small{font-size:13px;color:var(--muted)}
    .big{font-size:20px;font-weight:700}
    .market-list{max-height:240px;overflow:auto;margin-top:8px}
    .market-row{display:flex;justify-content:space-between;padding:8px;border-radius:8px}
    .marketplace{display:grid;grid-template-columns:1fr 380px;gap:18px}
    .form input,.form textarea{width:100%;padding:10px;border-radius:8px;border:0;background:rgba(255,255,255,0.02);color:inherit}
    .btn{background:var(--accent);border:0;padding:10px 12px;border-radius:8px;color:#032;cursor:pointer;font-weight:700}
    .camera-preview{width:100%;height:260px;background:#061220;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    footer{opacity:0.75;font-size:13px}
    @media (max-width:980px){
      .app{flex-direction:column;padding:12px}
      .sidebar{width:100%;display:flex;flex-direction:row;overflow:auto}
      .cards{grid-template-columns:1fr}
      .marketplace{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM + Babel for single-file JSX -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
  <!-- Chart.js for charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script type="text/babel">
  const { useState, useEffect, useRef } = React;

  /* ------------------------------
     Utility: (Replace with real APIs)
     These are placeholders representing:
       - Weather & climate detection
       - Market price feeds
       - Camera detection POST
     The original PDF describes: real-time weather, market prices, crop tips, sell produce, camera detection & climate detection. :contentReference[oaicite:1]{index=1}
     ------------------------------ */

  async function fakeWeatherAPI(location='Local Farm') {
    // Replace this with your weather API call (openweathermap, etc.)
    return new Promise(res=> setTimeout(()=> res({
      location, temp: Math.round(20 + Math.random()*8), condition: 'Partly cloudy', humidity: 58
    }), 350));
  }

  async function fakeMarketAPI() {
    // Replace with your market feed / DB
    return new Promise(res=> setTimeout(()=> res([
      {crop:'Wheat', price: 2150}, {crop:'Rice', price: 2520}, {crop:'Corn', price: 1800}, {crop:'Tomato', price: 32},
      {crop:'Potato', price: 26}, {crop:'Onion', price: 19}
    ]), 300));
  }

  /* ------------------------------
     Small UI components
     ------------------------------ */

  function Sidebar({active, setActive}) {
    const items = ['Dashboard','Marketplace','Crop Tips','Camera','Climate','Organic Study'];
    return (
      <aside className="sidebar">
        <div className="brand">
          <div className="logo">A</div>
          <div>
            <div style={{fontWeight:800}}>Agritrio</div>
            <div className="small">Farmers' assistant</div>
          </div>
        </div>

        <nav className="nav">
          {items.map(it=> (
            <button key={it} onClick={()=>setActive(it)} className={active===it? 'active':''}>{it}</button>
          ))}
        </nav>

        <div style={{marginTop:14}} className="small">Signed in as <strong>Farmer</strong></div>
      </aside>
    );
  }

  function WeatherCard({location}) {
    const [w,setW] = useState(null);
    useEffect(()=> {
      let mounted = true;
      fakeWeatherAPI(location).then(data=> mounted && setW(data));
      return ()=> mounted=false;
    },[location]);
    return (
      <div className="card">
        <div className="small">Weather — {location}</div>
        {w ? (
          <div style={{marginTop:8}}>
            <div className="big">{w.temp}°C</div>
            <div className="small">{w.condition} · Humidity {w.humidity}%</div>
          </div>
        ) : <div className="small">Loading...</div>}
      </div>
    );
  }

  function PricesCard() {
    const [prices,setPrices] = useState([]);
    useEffect(()=> {
      fakeMarketAPI().then(setPrices);
    },[]);
    return (
      <div className="card">
        <div className="small">Market Prices</div>
        <div className="market-list">
          {prices.map(p=> (
            <div key={p.crop} className="market-row">
              <div>{p.crop}</div>
              <div style={{fontWeight:700}}>₹ {p.price}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function PriceChart({data}) {
    const ref = useRef();
    useEffect(()=> {
      if(!ref.current) return;
      const ctx = ref.current.getContext('2d');
      const chart = new Chart(ctx, {
        type:'bar',
        data:{
          labels: data.map(d=>d.crop),
          datasets:[{label:'Price (₹)', data: data.map(d=>d.price), backgroundColor: 'rgba(255,255,255,0.06)', borderRadius:6}]
        },
        options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:false}}}
      });
      return ()=> chart.destroy();
    },[data]);
    return <canvas ref={ref} style={{width:'100%',height:180}} />;
  }

  /* ------------------------------
     Marketplace: create & store listings locally (localStorage)
     ------------------------------ */
  function Marketplace() {
    const [listings, setListings] = useState(()=> JSON.parse(localStorage.getItem('agritrio_listings')||'[]'));
    const [form, setForm] = useState({title:'', crop:'', qty:'', price:''});

    function addListing(e) {
      e.preventDefault();
      const entry = {...form, id: Date.now()};
      const next = [entry, ...listings];
      setListings(next);
      localStorage.setItem('agritrio_listings', JSON.stringify(next));
      setForm({title:'', crop:'', qty:'', price:''});
    }
    function removeItem(id) {
      const next = listings.filter(l=>l.id!==id);
      setListings(next);
      localStorage.setItem('agritrio_listings', JSON.stringify(next));
    }

    return (
      <div className="marketplace" style={{gap:18}}>
        <div>
          <div className="card">
            <div className="small">Create listing</div>
            <form className="form" onSubmit={addListing} style={{display:'grid',gap:8,marginTop:10}}>
              <input placeholder="Title (e.g. Fresh Wheat lot)" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} required />
              <input placeholder="Crop (e.g. Wheat)" value={form.crop} onChange={e=>setForm({...form,crop:e.target.value})} required />
              <input placeholder="Quantity (kg)" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} required />
              <input placeholder="Price (per kg)" value={form.price} onChange={e=>setForm({...form,price:e.target.value})} required />
              <div style={{display:'flex',gap:8}}>
                <button className="btn" type="submit">Post</button>
                <button type="button" onClick={()=>setForm({title:'', crop:'', qty:'', price:''})}>Clear</button>
              </div>
            </form>
          </div>

          <div className="card" style={{marginTop:12}}>
            <div className="small">Your listings</div>
            <div className="market-list">
              {listings.length===0 ? <div className="small" style={{padding:8}}>No listings yet</div> :
                listings.map(l=> (
                  <div key={l.id} className="market-row">
                    <div>
                      <div style={{fontWeight:700}}>{l.title}</div>
                      <div className="small">{l.crop} • {l.qty} kg</div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontWeight:700}}>₹{l.price}</div>
                      <div style={{marginTop:8}}>
                        <button onClick={()=>removeItem(l.id)}>Remove</button>
                      </div>
                    </div>
                  </div>
                ))
              }
            </div>
          </div>
        </div>

        <aside>
          <div className="card">
            <div className="small">Top market snapshot</div>
            <PricesCard />
          </div>
          <div className="card" style={{marginTop:12}}>
            <div className="small">Price trends</div>
            <div style={{marginTop:8}}>
              <PriceChart data={[
                {crop:'Wheat',price:2150},{crop:'Rice',price:2520},{crop:'Corn',price:1800},{crop:'Tomato',price:32}
              ]} />
            </div>
          </div>
        </aside>
      </div>
    );
  }

  /* ------------------------------
     Crop Tips + Organic Study (based on PDF topics)
     ------------------------------ */
  function CropTips() {
    const tips = [
      {title:'Soil Testing', body:'Get soil tested every season to decide fertilizer and correct pH.'},
      {title:'Irrigation Timing', body:'Irrigate early morning or late evening to save water.'},
      {title:'Pest Management', body:'Use integrated pest management and neem-based organic solutions.'}
    ];
    return (
      <div className="card">
        <div className="small">Crop care & organic study</div>
        <div style={{marginTop:10,display:'grid',gap:10}}>
          {tips.map(t=> (
            <div key={t.title} style={{padding:10,background:'rgba(255,255,255,0.02)',borderRadius:8}}>
              <div style={{fontWeight:700}}>{t.title}</div>
              <div className="small">{t.body}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ------------------------------
     Camera detection component
     - Start camera (facing environment)
     - Capture frame -> base64
     - Example fetch to send image to detection API (commented)
     ------------------------------ */
  function CameraPanel() {
    const videoRef = useRef();
    const [streaming,setStreaming] = useState(false);
    const [captured, setCaptured] = useState(null);

    useEffect(()=> {
      // cleanup when unmount
      return ()=> {
        if(videoRef.current && videoRef.current.srcObject) {
          videoRef.current.srcObject.getTracks().forEach(t=>t.stop());
        }
      }
    },[]);

    async function startCamera() {
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio:false });
        videoRef.current.srcObject = stream;
        videoRef.current.play();
        setStreaming(true);
      }catch(err){
        alert('Camera not available or permission denied.');
      }
    }

    function capture() {
      if(!videoRef.current) return;
      const canvas = document.createElement('canvas');
      canvas.width = videoRef.current.videoWidth || 1280;
      canvas.height = videoRef.current.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
      const dataURL = canvas.toDataURL('image/jpeg', 0.9);
      setCaptured(dataURL);
    }

    async function sendForDetection() {
      if(!captured) return alert('Capture an image first.');
      // Example: POST to your detection endpoint
      // fetch('https://your-server.example/api/detect', {
      //   method:'POST',
      //   headers:{ 'Content-Type':'application/json' },
      //   body: JSON.stringify({ image: captured })
      // }).then(r=>r.json()).then(res=>console.log(res));

      alert('Image captured. Send it to your detection API (see code comments).');
    }

    return (
      <div>
        <div className="card">
          <div className="small">Camera — Detection</div>
          <div style={{marginTop:10}}>
            <div className="camera-preview">
              <video ref={videoRef} style={{width:'100%',height:'100%',objectFit:'cover'}} />
              {!streaming && <div style={{position:'absolute'}}>Camera stopped</div>}
            </div>

            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button className="btn" onClick={startCamera}>Start Camera</button>
              <button onClick={capture}>Capture</button>
              <button onClick={sendForDetection} disabled={!captured}>Send for detection</button>
            </div>
          </div>

          {captured && (
            <div style={{marginTop:12}}>
              <div className="small">Captured snapshot</div>
              <img src={captured} style={{width:'100%',marginTop:8,borderRadius:8}} />
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ------------------------------
     Climate module: placeholder for climate detection / study
     Based on PDF keywords: "CLIMATE DETECTION", "CEMERA DETECTION", "ORGANIC" etc. :contentReference[oaicite:2]{index=2}
     ------------------------------ */
  function ClimatePanel() {
    const [summary, setSummary] = useState('No climate alerts');
    // Example: could poll climate APIs / satellite data / local sensors
    useEffect(()=> {
      // Simulate detection
      const t = setTimeout(()=> setSummary('No extreme events detected in last 48 hours'), 400);
      return ()=> clearTimeout(t);
    },[]);
    return (
      <div className="card">
        <div className="small">Climate & Alerts</div>
        <div style={{marginTop:12}}>
          <div style={{fontWeight:700}}>{summary}</div>
          <div className="small" style={{marginTop:8}}>Tip: Integrate local sensor feed or third-party APIs for real alarms.</div>
        </div>
      </div>
    );
  }

  /* ------------------------------
     Main Dashboard
     ------------------------------ */
  function DashboardMain() {
    const [marketData,setMarketData] = useState([]);

    useEffect(()=> {
      fakeMarketAPI().then(setMarketData);
    },[]);

    return (
      <>
        <div className="cards">
          <WeatherCard location="Local Farm" />
          <div className="card">
            <div className="small">Quick actions</div>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button className="btn">Create listing</button>
              <button>Request transport</button>
              <button>Contact buyer</button>
            </div>
            <div style={{marginTop:12}}>
              <div className="small">Recent prices</div>
              <div style={{display:'flex',gap:8,marginTop:8}}>
                {marketData.slice(0,3).map(m=>(
                  <div key={m.crop} style={{flex:1,background:'rgba(255,255,255,0.01)',padding:10,borderRadius:8}}>
                    <div style={{fontWeight:700}}>{m.crop}</div>
                    <div className="small">₹{m.price}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="card">
            <div className="small">Alerts</div>
            <div style={{marginTop:8,padding:10,background:'rgba(255,60,60,0.04)',borderRadius:8}}>
              <div style={{fontWeight:700}}>Pest advisory</div>
              <div className="small">Localised pest activity reported — apply recommended control.</div>
            </div>
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 420px',gap:18,marginTop:8}}>
          <div>
            <CropTips />
            <div style={{marginTop:18}}>
              <div className="card">
                <div className="small">Marketplace highlights</div>
                <div style={{marginTop:10}}>
                  <PricesCard />
                </div>
              </div>
            </div>
          </div>

          <aside>
            <ClimatePanel />
            <div className="card" style={{marginTop:12}}>
              <div className="small">Insights</div>
              <div style={{marginTop:10}}>
                <div className="small">Recommendation: Rotate Rice → Legumes</div>
                <div className="small">Profitability: Moderate</div>
              </div>
            </div>
          </aside>
        </div>
      </>
    );
  }

  /* ------------------------------
     App root
     ------------------------------ */
  function App() {
    const [active, setActive] = useState('Dashboard');

    return (
      <div className="app">
        <Sidebar active={active} setActive={setActive} />
        <main className="main">
          <div className="topbar">
            <div>
              <div style={{fontSize:20,fontWeight:800}}>Agritrio</div>
              <div className="small">Digital assistant for farmers</div>
            </div>
            <div style={{display:'flex',gap:12,alignItems:'center'}}>
              <div className="small">Balance: ₹ 12,400</div>
              <div style={{width:42,height:42,borderRadius:10,background:'#083045',display:'flex',alignItems:'center',justifyContent:'center'}}>FA</div>
            </div>
          </div>

          <div style={{overflow:'auto',paddingTop:8}}>
            {active === 'Dashboard' && <DashboardMain />}
            {active === 'Marketplace' && <Marketplace />}
            {active === 'Crop Tips' && <CropTips />}
            {active === 'Camera' && <CameraPanel />}
            {active === 'Climate' && <ClimatePanel />}
            {active === 'Organic Study' && (
              <div className="card">
                <div className="small">Organic farming study</div>
                <div style={{marginTop:8}} className="small">
                  Placeholder: Add modules about composting, organic fertilizers, certification steps and local resources.
                </div>
              </div>
            )}
          </div>

          <footer style={{marginTop:18}}>
            <div className="small">Agritrio • Built for farmers • Demo (based on your project brief). :contentReference[oaicite:3]{index=3}</div>
          </footer>
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
